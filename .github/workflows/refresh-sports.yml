name: Refresh sports calendar
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sports-calendar-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch upcoming football, NHL and MLB fixtures
        run: python scripts/fetch_fixtures.py
      - name: Validate and merge verified fixtures
        run: python scripts/refresh_sports.py
      - name: Commit calendar changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sports.ics data/fixtures.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh spoiler-safe sports calendar"
            git push
          else
            echo "No calendar changes to publish"
          fi
